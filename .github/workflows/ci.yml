name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # executes the Store's MULTIs against a real redis — the unit suite runs against in-memory fakes
      - run: pnpm test:redis
        env:
          REDIS_TEST_URL: redis://localhost:6390
      - run: pnpm build
      - name: docker compose config parses
        run: cp .env.example .env && docker compose config -q && docker compose -f docker-compose.prod.yml config -q
