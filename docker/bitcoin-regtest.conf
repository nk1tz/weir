# bitcoin.conf for the compose 'regtest' profile — a throwaway local chain.
# Mounted read-only at /home/bitcoin/.bitcoin/bitcoin.conf by docker-compose.yml.

# run the regression-test chain (blocks minable on demand, coins are worthless)
regtest=1

# accept JSON-RPC commands
server=1

# static RPC credentials — acceptable ONLY on regtest where coins have no value.
# mainnet/signet configs use rpcauth instead (see bitcoin-mainnet.conf).
rpcuser=weir
rpcpassword=weir

# accept RPC from the docker compose network. Docker allocates subnets from the
# RFC1918 pools; nothing outside the compose network can reach this container
# anyway (no published ports).
rpcallowip=10.0.0.0/8
rpcallowip=172.16.0.0/12
rpcallowip=192.168.0.0/16

# raw transaction + raw block streams weir subscribes to (same port is fine)
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubrawblock=tcp://0.0.0.0:28332

# regtest has no fee market so estimatesmartfee never works; sendtoaddress
# needs a fallback rate (BTC/kvB)
fallbackfee=0.0001

# network-restricted options must live in the [regtest] section
[regtest]
# listen for RPC on all container interfaces so weir can connect (port 18443)
rpcbind=0.0.0.0
