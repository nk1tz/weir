# Example bitcoin.conf for running weir against MAINNET.
# docker-compose.prod.yml binds this at /etc/bitcoin/bitcoin.conf (read-only, passed with -conf);
# for a node you run yourself, merge it into that node's config.

# accept JSON-RPC commands
server=1

# pruned node — weir is built for pruned nodes (no txindex, no address index, forward-only).
# The prune window is also how long weir may be down before it loses its tracking history
# (a "prune-window reset", see docs/DESIGN.md): 10000 MB ≈ a week of blocks.
prune=10000

# uncomment on a 4 GB box
#dbcache=300
#maxmempool=150

# RPC auth: NEVER use rpcuser/rpcpassword on mainnet. Generate a salted hash
# with the rpcauth.py script shipped in the Bitcoin Core repo
# (share/rpcauth/rpcauth.py):  python3 rpcauth.py weir
# then paste the printed line here and put the printed password in BITCOIN_RPC_URL.
#rpcauth=weir:REPLACE_WITH_OUTPUT_OF_rpcauth.py

# accept RPC from the docker/compose network (RFC1918 ranges) — tighten to your
# actual subnet if you know it, and never expose the RPC port publicly
rpcallowip=10.0.0.0/8
# docker's default bridge/compose pool
rpcallowip=172.16.0.0/12
# alternate compose address pool
rpcallowip=192.168.0.0/16

# raw transaction stream weir subscribes to
zmqpubrawtx=tcp://0.0.0.0:28332
# raw block stream weir subscribes to (same port as rawtx is fine)
zmqpubrawblock=tcp://0.0.0.0:28332

# network-restricted options for mainnet live in the [main] section
[main]
# listen for RPC on all container interfaces (mainnet RPC port: 8332)
rpcbind=0.0.0.0
