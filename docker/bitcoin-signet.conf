# Example bitcoin.conf for running weir against SIGNET.
# Mount at /home/bitcoin/.bitcoin/bitcoin.conf (read-only) or merge into your node's config.

# run the signet test network (default global signet — real-ish network, worthless coins)
signet=1

# accept JSON-RPC commands
server=1

# pruned node — keep ~2000 MB of blocks; weir is built for pruned nodes
# (no txindex, no address index, forward-only)
prune=2000

# RPC auth: do NOT use rpcuser/rpcpassword outside regtest. Generate a salted
# hash with the rpcauth.py script shipped in the Bitcoin Core repo
# (share/rpcauth/rpcauth.py):  python3 rpcauth.py weir
# then paste the printed line here and put the printed password in BITCOIN_RPC_URL.
#rpcauth=weir:REPLACE_WITH_OUTPUT_OF_rpcauth.py

# accept RPC from the docker/compose network (RFC1918 ranges) — tighten to your
# actual subnet if you know it
rpcallowip=10.0.0.0/8
# docker's default bridge/compose pool
rpcallowip=172.16.0.0/12
# alternate compose address pool
rpcallowip=192.168.0.0/16

# raw transaction stream weir subscribes to
zmqpubrawtx=tcp://0.0.0.0:28332
# raw block stream weir subscribes to (same port as rawtx is fine)
zmqpubrawblock=tcp://0.0.0.0:28332

# network-restricted options must live in the [signet] section
[signet]
# listen for RPC on all container interfaces (signet RPC port: 38332)
rpcbind=0.0.0.0
