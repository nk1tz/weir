# weir production stack: prebuilt weir image from GHCR + redis + bitcoind.
# STANDALONE — not an override of docker-compose.yml. Always pass it with -f:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# One directory per stack, each its own compose project with its own .env:
#   ~/weir-mainnet/.env   NETWORK=mainnet   BITCOIND_CONF=./docker/bitcoin-mainnet.conf
#   ~/weir-regtest/.env   NETWORK=regtest   BITCOIND_CONF=./docker/bitcoin-regtest.conf
#
# Variables this file reads from .env (all optional; defaults in parentheses):
#   WEIR_VERSION      tag of ghcr.io/nk1tz/weir        (latest)
#   BITCOIND_VERSION  tag of bitcoin/bitcoin            (31)
#   BITCOIND_CONF     bitcoin.conf to mount, read-only  (./docker/bitcoin-mainnet.conf)
#
# Upgrade weir:
#   docker compose -f docker-compose.prod.yml pull weir && docker compose -f docker-compose.prod.yml up -d weir
#
# NO published ports: weir listens on nothing (unless ADMIN_TOKEN), redis and
# bitcoind are reachable only on the compose network.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  weir:
    image: ghcr.io/nk1tz/weir:${WEIR_VERSION:-latest}
    env_file: .env
    depends_on:
      - redis
      - bitcoind
    restart: unless-stopped
    # lets WEBHOOK_URL=http://host.docker.internal:... reach the host on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *logging

  redis:
    image: redis:7.4-alpine
    # appendonly: the watch set + chain view must survive restarts.
    # noeviction: eviction would silently delete watches — weir's preflight refuses any other policy.
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *logging

  bitcoind:
    image: bitcoin/bitcoin:${BITCOIND_VERSION:-31}
    # The image's entrypoint chowns the whole datadir; a read-only file mounted INSIDE it
    # makes that chown fail and the container exit. So the conf lives outside the datadir
    # and is passed with -conf. The datadir itself is a named volume the entrypoint owns.
    # -nodebuglogfile: docker's json-file rotation covers stdout; without it Core also
    # writes an unbounded debug.log inside the datadir volume.
    command: ["bitcoind", "-conf=/etc/bitcoin/bitcoin.conf", "-datadir=/home/bitcoin/.bitcoin", "-nodebuglogfile"]
    volumes:
      # long syntax + create_host_path:false: a mistyped conf path fails instead of
      # silently becoming an empty directory
      - type: bind
        source: ${BITCOIND_CONF:-./docker/bitcoin-mainnet.conf}
        target: /etc/bitcoin/bitcoin.conf
        read_only: true
        bind:
          create_host_path: false
      - bitcoind-data:/home/bitcoin/.bitcoin
      # assumeutxo: `mkdir -p snapshots` BEFORE first `up` (else docker creates it root-owned),
      # put utxo-<height>.dat there, then (exec bypasses the entrypoint, so pass user + datadir;
      # the cookie file lives in the datadir; timeout 0 because the load runs a long time):
      #   docker compose -f docker-compose.prod.yml exec --user bitcoin bitcoind \
      #     bitcoin-cli -conf=/etc/bitcoin/bitcoin.conf -datadir=/home/bitcoin/.bitcoin \
      #     -rpcclienttimeout=0 loadtxoutset /snapshots/utxo-<height>.dat
      # Delete the file once `getchainstates` shows the snapshot chainstate is active.
      - ./snapshots:/snapshots:ro
    restart: unless-stopped
    logging: *logging

volumes:
  redis-data:
  bitcoind-data:
